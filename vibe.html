<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI产品应用 | 知行工坊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/vibe.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="description" content="探索AI工具在产品设计、开发与优化中的实际应用，记录每一次从概念到落地的实践过程与思考。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI产品应用实践 | 知行工坊">
    <meta property="og:description" content="探索AI工具在产品设计、开发与优化中的实际应用，记录实践过程与思考。">
    <meta property="og:url" content="https://wjrachel.github.io/portfolio/vibe.html">
    <meta property="og:image" content="https://wjrachel.github.io/portfolio/assets/avatar.png">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        // 防主题闪烁：首帧前应用已保存的主题
        (function () {
            try {
                document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="container">
        <a href="index.html#zhixing" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            返回知行工坊
        </a>

        <header class="page-header">
            <p class="page-label reveal">Workshop / 02</p>
            <h1 class="page-title reveal reveal-d1">AI产品应用实践</h1>
            <p class="page-desc reveal reveal-d2">探索AI工具在产品设计、开发与优化中的实际应用，记录每一次从概念到落地的实践过程与思考。</p>
        </header>

        <section class="cases-section">
            <div class="section-header" style="margin-bottom: 40px;">
                <p class="section-label reveal">Showcase</p>
                <h2 class="section-heading reveal reveal-d1">实践案例</h2>
            </div>
            
            <div id="casesContainer" class="cases-container">
                <!-- 案例列表将在这里动态渲染 -->
            </div>
        </section>
    </div>

    <footer>
        <p>© 2026 王瑾 · 知行工坊 · AI产品应用实践</p>
    </footer>

    <script src="scripts/theme.js"></script>
    <script src="scripts/components.js"></script>
    <script src="scripts/scroll-reveal.js"></script>
    <script src="scripts/security.js"></script>

    <script>
        // 静态案例数据：由 build-cases.js 生成到 cases/cases.json（单一数据源，勿手改此处）
        let staticCases = [];

        // 加载案例列表
        async function loadCases() {
            // 从 cases/cases.json 读取（由 build-cases.js 生成）
            try {
                const res = await fetch('cases/cases.json');
                if (res.ok) staticCases = await res.json();
            } catch (e) {
                console.error('加载案例列表失败：', e);
            }
            const container = document.getElementById('casesContainer');

            if (staticCases.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 64px 0; background: var(--surface); border-radius: 16px; border: 1px dashed var(--border);">
                        <svg viewBox="0 0 24 24" style="width: 64px; height: 64px; fill: var(--text-3); margin: 0 auto 16px;"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        <p style="font-size: 1.1rem; color: var(--text-2); margin-bottom: 8px;">暂无实践案例</p>
                        <p style="font-size: .9rem; color: var(--text-3);">更多案例即将上线</p>
                    </div>
                `;
                return;
            }

            // 渲染案例卡片列表（内容经 escapeHtml 转义；点击用事件委托）
            const casesHtml = staticCases.map((item) => {
                const safeId = escapeHtml(item.id);
                return `
                    <article class="case-card" data-id="${safeId}" style="
                        background: var(--surface);
                        border-radius: 16px;
                        padding: 24px;
                        transition: all 0.3s ease;
                        border: 1px solid var(--border);
                        position: relative;
                        cursor: pointer;
                        min-height: 220px;
                    ">
                        <div style="margin-bottom: 16px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <h3 style="font-family: var(--font-display); font-size: 1.35rem; color: var(--text); margin: 0; line-height: 1.3;">${escapeHtml(item.title)}</h3>
                                <span style="font-size: 0.82rem; color: var(--text-3); flex-shrink: 0; margin-left: 16px;">${escapeHtml(item.createdAt)}</span>
                            </div>
                        </div>

                        <div style="display: flex; gap: 20px; align-items: flex-start;">
                            <div style="
                                width: 120px;
                                height: 120px;
                                flex-shrink: 0;
                                background: var(--border);
                                border-radius: 12px;
                                overflow: hidden;
                            ">
                                ${item.coverImage ? `
                                    <img src="${escapeHtml(item.coverImage)}" alt="${escapeHtml(item.title)}" style="width: 100%; height: 100%; object-fit: cover;" />
                                ` : `
                                    <svg viewBox="0 0 24 24" style="width: 48px; height: 48px; fill: var(--text-3); margin: 36px;" />
                                `}
                            </div>

                            <div style="flex: 1; min-width: 0;">
                                <p style="color: var(--text-2); font-size: 0.95rem; line-height: 1.7; margin: 0;">${escapeHtml(item.excerpt) || '暂无简介'}</p>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            container.innerHTML = casesHtml;
        }

        // 事件委托：点击卡片跳转详情页
        document.getElementById('casesContainer').addEventListener('click', function (e) {
            const card = e.target.closest('.case-card');
            if (!card) return;
            const item = staticCases.find(c => c.id === card.dataset.id);
            if (item && item.detailUrl) {
                window.location.href = item.detailUrl;
            }
        });

        // 页面加载时加载案例
        document.addEventListener('DOMContentLoaded', loadCases);
    </script>
