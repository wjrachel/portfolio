<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        // 防主题闪烁：首帧前应用已保存的主题
        (function () {
            try {
                document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
            } catch (e) {}
        })();
    </script>
    <style>
        .detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .detail-header {
            margin-bottom: 32px;
        }

        .detail-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            color: var(--text);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            color: var(--text-3);
            font-size: 0.9rem;
        }

        .detail-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
        }

        .detail-content h1,
        .detail-content h2,
        .detail-content h3,
        .detail-content h4 {
            font-family: var(--font-display);
            margin: 24px 0 12px;
            color: var(--text);
        }

        .detail-content h1 { font-size: 1.8rem; }
        .detail-content h2 { font-size: 1.5rem; }
        .detail-content h3 { font-size: 1.3rem; }
        .detail-content h4 { font-size: 1.15rem; }

        .detail-content p {
            margin: 12px 0;
        }

        .detail-content ul,
        .detail-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .detail-content li {
            margin: 6px 0;
        }

        .detail-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-2);
            font-style: italic;
        }

        .detail-content pre {
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid var(--border);
        }

        .detail-content code {
            background: var(--accent-soft);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
        }

        .detail-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 16px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        .detail-content img.loading {
            background: var(--border);
            min-height: 200px;
        }

        .detail-content img.failed {
            display: none;
        }

        .image-fallback {
            background: var(--accent-soft);
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 32px;
            margin: 16px 0;
            text-align: center;
        }

        .image-fallback svg {
            width: 48px;
            height: 48px;
            fill: var(--text-3);
            margin-bottom: 12px;
        }

        .image-fallback p {
            color: var(--text-3);
            font-size: 0.9rem;
            margin: 0;
        }

        .detail-content a {
            color: var(--accent);
            text-decoration: none;
        }

        .detail-content a:hover {
            text-decoration: underline;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-2);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--accent);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div class="detail-container">
        <a href="vibe.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            返回案例列表
        </a>

        <article>
            <header class="detail-header">
                <h1 class="detail-title">{{CASE_TITLE}}</h1>
                <div class="detail-meta">
                    <span>发布于 {{DATE}}</span>
                </div>
            </header>
            <div class="detail-content">
{{BODY}}
            </div>
        </article>
    </div>

    <footer>
        <p>© 2026 王瑾 · 知行工坊 · AI产品应用实践</p>
    </footer>

    <script src="scripts/theme.js"></script>
    <script>
        // 图片加载失败处理
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('.detail-content img');

            images.forEach(img => {
                img.addEventListener('error', function() {
                    const fallback = document.createElement('div');
                    fallback.className = 'image-fallback';
                    fallback.innerHTML = `
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        <p>图片加载失败</p>
                    `;
                    img.parentNode.replaceChild(fallback, img);
                });

                img.classList.add('loading');

                img.addEventListener('load', function() {
                    img.classList.remove('loading');
                });
            });
        });
    </script>
</body>
</html>
